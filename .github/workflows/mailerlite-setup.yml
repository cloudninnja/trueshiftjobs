name: MailerLite setup check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/mailerlite_setup.py
      - .github/workflows/mailerlite-setup.yml

permissions:
  contents: write

concurrency:
  group: site-commit
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up MailerLite and check what the plan allows
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
        run: python scripts/mailerlite_setup.py
      - name: Save the result
        run: |
          git config user.name cloudninnja
          git config user.email 246280380+cloudninnja@users.noreply.github.com
          git add mailerlite-status.json
          git diff --cached --quiet || git commit -m "MailerLite setup check result"
          git pull --rebase && git push
