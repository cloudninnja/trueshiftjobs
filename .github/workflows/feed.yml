name: Nightly job feed

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC (05:17 London time in winter, 06:17 in summer)
  workflow_dispatch:        # lets you run it any time from the Actions tab
  push:                     # runs again whenever the feed script itself changes
    branches: [main]
    paths: ["scripts/**", ".github/workflows/feed.yml"]

permissions:
  contents: write

concurrency:
  group: job-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect jobs from the feeds
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          APPRENTICESHIP_API_KEY: ${{ secrets.APPRENTICESHIP_API_KEY }}
          EMPLOYER_JOBS_CSV: ${{ secrets.EMPLOYER_JOBS_CSV }}
        run: python scripts/fetch_feed.py

      - name: Save the new feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json feed-status.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Nightly job feed $(date -u +%F)"
            git pull --rebase
            git push
          fi
